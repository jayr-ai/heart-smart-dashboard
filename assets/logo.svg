<svg viewBox="0 0 160 140" xmlns="http://www.w3.org/2000/svg">
  <!-- Heart Smart M Wave Logo -->
  <defs>
    <linearGradient id="waveGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF5757;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8080;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Left wave bump -->
  <path d="M 20 120 Q 25 80 40 70 Q 55 60 60 120 Z" fill="url(#waveGradient)" stroke="none"/>

  <!-- Center wave bump (tallest) -->
  <path d="M 70 140 Q 75 40 80 20 Q 85 40 90 140 Z" fill="url(#waveGradient)" stroke="none"/>

  <!-- Right wave bump -->
  <path d="M 100 120 Q 115 60 130 70 Q 145 80 150 120 Z" fill="url(#waveGradient)" stroke="none"/>
</svg>